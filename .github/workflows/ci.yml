name: CI

on:
  push:
    branches: [init]
  pull_request:
    branches: [init]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  light-gate:
    name: Light Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run light conformance checks
        run: nix flake check --accept-flake-config --no-eval-cache --print-build-logs

  heavy-gate:
    name: Heavy Haskell Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build upstream and example Haskell checks
        run: nix build --accept-flake-config .#heavy-checks --print-build-logs
